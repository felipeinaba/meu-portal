<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Felipe</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #111827;
    }
    main {
      text-align: center;
      padding: 32px;
    }
    h1 {
      margin: 0 0 24px;
      font-size: clamp(2rem, 6vw, 4rem);
    }
    .entrar {
      display: inline-block;
      padding: 14px 30px;
      border: 0;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 1rem;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }
    .entrar:hover { opacity: .9; }
  </style>
</head>
<body>
  <main>
    <h1>Portal Felipe</h1>
    <button class="entrar" type="button">Entrar</button>
  </main>
</body>
</html>
