<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portal Felipe — Despesas</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f7fb;color:#182230;font-family:Arial,sans-serif}.wrap{max-width:980px;margin:auto;padding:28px 18px}h1{margin:0 0 5px}.muted,.meta{color:#667085;font-size:14px}.grid{display:grid;grid-template-columns:360px 1fr;gap:20px;margin-top:24px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:20px}h2{font-size:18px;margin:0 0 16px}label{display:block;font-size:13px;font-weight:600;margin:12px 0 6px}input,select,textarea{width:100%;padding:11px;border:1px solid #d0d5dd;border-radius:9px;font:inherit}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}textarea{min-height:70px}button{width:100%;margin-top:18px;padding:12px;border:0;border-radius:10px;background:#2563eb;color:#fff;font-weight:700}.item{padding:14px 0;border-bottom:1px solid #eee}.top{display:flex;justify-content:space-between;gap:12px}.amount{font-weight:700}.empty{text-align:center;color:#667085;padding:28px}.ok{color:#067647}.err{color:#b42318}#msg{font-size:13px;margin-top:9px}@media(max-width:760px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><h1>Despesas</h1><div class="muted">Controle financeiro pessoal</div><div class="grid"><section class="card"><h2>Novo lançamento</h2><form id="form"><label>Descrição</label><input id="description" required placeholder="Ex.: Supermercado"><div class="row"><div><label>Valor</label><input id="amount" required inputmode="decimal" placeholder="0,00"></div><div><label>Data</label><input id="date" type="date" required></div></div><label>Categoria</label><select id="category"><option value="">Selecione</option><option>Alimentação</option><option>Moradia</option><option>Transporte</option><option>Saúde</option><option>Lazer</option><option>Compras</option><option>Outros</option></select><label>Forma de pagamento</label><select id="payment"><option value="">Selecione</option><option>Pix</option><option>Cartão de crédito</option><option>Cartão de débito</option><option>Dinheiro</option><option>Boleto</option></select><label>Observações</label><textarea id="notes" placeholder="Opcional"></textarea><button id="save">Salvar despesa</button><div id="msg"></div></form></section><section class="card"><h2>Últimos lançamentos</h2><div id="list" class="empty">Carregando...</div></section></div></div><script>const $=i=>document.getElementById(i);$('date').value=new Date().toISOString().slice(0,10);const money=v=>Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),fmt=d=>new Date(d).toLocaleDateString('pt-BR'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){try{let r=await fetch('/api/expenses');if(!r.ok)throw 0;let a=await r.json();$('list').className=a.length?'':'empty';$('list').innerHTML=a.length?a.map(x=>'<div class="item"><div class="top"><strong>'+esc(x.description)+'</strong><span class="amount">'+money(x.amount)+'</span></div><div class="meta">'+fmt(x.expense_date)+(x.category?' · '+esc(x.category):'')+(x.payment_method?' · '+esc(x.payment_method):'')+'</div></div>').join(''):'Nenhuma despesa cadastrada ainda.'}catch(e){$('list').innerHTML='Não foi possível carregar as despesas.'}}$('form').onsubmit=async e=>{e.preventDefault();$('save').disabled=true;$('msg').textContent='Salvando...';let amount=Number($('amount').value.replace(/\./g,'').replace(',','.'));try{let r=await fetch('/api/expenses',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({expense_date:$('date').value,description:$('description').value,amount,category:$('category').value,payment_method:$('payment').value,notes:$('notes').value})}),j=await r.json();if(!r.ok)throw Error(j.error);$('msg').textContent='Despesa salva.';$('msg').className='ok';$('form').reset();$('date').value=new Date().toISOString().slice(0,10);load()}catch(x){$('msg').textContent=x.message||'Erro ao salvar.';$('msg').className='err'}finally{$('save').disabled=false}};load()</script></body></html>
